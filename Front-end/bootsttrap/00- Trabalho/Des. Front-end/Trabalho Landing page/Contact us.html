<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
    background:#111;
    font-family:Arial, Helvetica, sans-serif;
    color:#fff;
}

.topo{
    background:linear-gradient(180deg,#ffffff,#1c1c1c);
    color:#fff;
    padding:50px 0;
    text-align:center;
    border-bottom:3px solid #555;
}

.card{
    background:#1c1c1c;
    color:#fff;
    border:1px solid #555;
    border-radius:15px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#888;
}

.icone{
    font-size:45px;
    color:#d9d9d9;
    margin-bottom:15px;
}

.card h4{
    color:#fff;
}

.card p{
    color:#cfcfcf;
}

.btn-dark{
    background:#555;
    border:none;
    color:#fff;
    transition:0.3s;
}

.btn-dark:hover{
    background:#777;
}

footer{
    background:#000;
    color:#fff;
    padding:20px;
    margin-top:50px;
    text-align:center;
    border-top:2px solid #555;
}

a{
    text-decoration:none;
}

iframe{
    border-radius:15px;
    border:2px solid #555;
}
  
header img{
    width:220px;
    height: 220px;
    border-radius:50%;
    margin-bottom:20px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}
  
.botao{
    display: inline-block;
    background: linear-gradient(135deg, #000, #3d3d3d);
    color: #fff;
    text-decoration: none;
    padding: 14px 30px;
    border-radius: 40px;
    border: 2px solid #7a7a7a;
    font-size: 17px;
    font-weight: bold;
    transition: all 0.3s ease;
    box-shadow: 0 6px 15px rgba(0,0,0,0.4);
}

.botao:hover{
    background: linear-gradient(135deg, #ffffff, #d9d9d9);
    color: #000;
    border-color: #000;
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.botao:active{
    transform: scale(0.97);
}
  
    </style>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <header class="topo">
        
    <div class="container d-flex flex-column">

        <a href="#" class="navbar-brand text-center mb-3">
            <img src="Fotos/Duck logo.png" alt="Logo Duck Dot">
        </a>
    </div>
        
      
        <a href="Landing page.html" class="botao">Return to the main page</a>
    </header>
  

    <div class="container py-5">

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card shadow p-4 text-center h-100">
                    <div class="icone">
                        <i class="fa-solid fa-phone"></i>
                    </div>

                    <h4>Phone number</h4>

                    <p>(35) 91234-5678</p>

                    <a href="tel:+5535912345678" class="btn btn-dark">
                        Call now
                    </a>

                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow p-4 text-center h-100">

                    <div class="icone">
                        <i class="fa-brands fa-instagram"></i>
                    </div>

                    <h4>Social media</h4>

                    <p>Follow us on instagram</p>

                    <a href="https://instagram.com/seuperfil" target="_blank" class="btn btn-dark">
                        @Duck_Dot
                    </a>

                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow p-4 text-center h-100">

                    <div class="icone">
                        <i class="fa-brands fa-discord"></i>
                    </div>

                    <h4>Discord</h4>

                    <p>Join our channel for exclusive content.</p>

                    <a href="https://pt.wikipedia.org/wiki/Discord" target="_blank" class="btn btn-dark">
                        Join
                    </a>

                </div>
            </div>

        </div>

    </div>

    <footer>
        © 2026 Duck Dot
    </footer>

</body>
</html>
