<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk Escolar - Abrir chamado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">

        <div class="topo">

            <span class="topo-conteudo">HelpDesk Escolar</span>
            <nav class="topo-nav">

                <a href="index.html" class="ativo">Abrir Chamado</a>
                <a href="chamados.html">Ver chamados</a>

            </nav>

        </div>

    </header>

    <main class="conteudo">

        <div class="cartao">

            <h1>Abrir novo chamado</h1>
            <p class="subtitulo">Descreva o problema na escola. A equipe responsável vai analisar e atualizar o status.</p>
            <form id="form-chamado" novalidate>

                <div class="campo">

                    <label for="setor">Nome do solicitante</label>
                    <input type="text" id="setor" name="setor" placeholder="EX: Sala 12, Laboratório 2, Secretaria" required>

                </div>
                <div class="campo">

                    <label for="prioridade">Prioridade</label>
                    <select name="prioridade" id="prioridade" required>

                        <option value="" disable selected>Selecione</option>
                        <option value="baixa">Baixa</option>
                        <option value="media">Média</option>
                        <option value="alta">Alta</option>

                    </select>

                </div>
                <div class="campo">

                    <label for="descricao">Descrição do problema</label>
                    <textarea id="descricao" name="descricao" rows="4" placeholder="Explique com detalhes o que está acontecendo" required></textarea>

                </div>
                <button type="submit" class="botao-principal">Registrar Chamado</button>
                <p id="mensagem-status" class="mensagem-status" role="status" aria-live="polite"></p>

            </form>

        </div>
        
    </main>

    <script src="storage.js"></script>
    <script src="app.js"></script>

</body>
</html>
