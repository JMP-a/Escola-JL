<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=8, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cotrole de entrada</h1>

        <label>Uniformizado:</label>
        <select id="uniforme">
            <option value="true"> Sim </option>
            <option value="fale"> Não </option>
        </select>
        <label>Está na lista</label>
            <select id="lista">
                <option value="true"> Sim </option>
                <option value="false"> Não </option>
            </select>
        <label>Atraso (minutos):</label>
        <input type="number" id="atraso">

        <label>Tem autorização</label>
            <select id="autorizacao">
                <option value="true"> Sim </option>
                <option value="false"> Não </option>
            </select>
        <label>Tem pendência</label>
            <select id="pendencia">
                <option value="true"> Sim </option>
                <option value="false"> Não </option>
            </select>
        <label>Laboratório lotado</label>
            <select id="lotado">
                <option value="true"> Sim </option>
                <option value="false"> Não </option>
            </select>
        
        <button onclick="verificarEntrada()">Verificar</button>
        <h2 id="resultado"></h2>
        <div class="painel">
            <p><strong>Total de entradas permitidas: </strong><span>0</span></p>
        </div>
        <div class="painel">
            <h3>histórico de verificação</h3>
            <ul id="listaHistorico"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
