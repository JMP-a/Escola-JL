<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpdeskEscolar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topo">

        <div class="topo-conteudo">
            <span class="topo-marca">
                Helpdesk Escolar
            </span>
            <nav class="topo-nav">
                <a href="index.html">abrir chamado</a>
                <a href="chamados.html" class="ativo">Ver chamado</a>

            </nav>
        </div>
    </header>
    <main class="conteudo conteudo-larga">
        <div class="cabecalho-lista">
            <div>
                <h1>Chamados Registrados</h1>
                <p class="subtitulo">acompanhe, filtre e atualize os status dos chamados abertos pela escola.</p>
                
            </div>
            <div class="campo campo-filtro">
                <label for="filtro-status">Filtrar por status</label>
                <select id="filtro-status">
                    <option value="todos">Todos</option>
                    <option value="em andamento">Em andamento</option>
                    <option value="aberto">Aberto</option>
                    <option value="resolvido">Resolvido</option>
                </select>
            </div>
        </div>
        <div id="lista-chamados" class="lista-chamados">
            <!-- Os cartões de chamado são inseridos aqui via java script -->
        </div>
        <p id="mensagem-vazia" class="mensagem-vazia" hidden>
            <!-- Nenhum chamado encontrado para esse filtro-->
        </p>
    </main>
    <script src="storage.js"></script>
    <script src="chamados.js"></script>
</body>

</html>
